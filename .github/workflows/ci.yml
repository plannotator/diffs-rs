name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The viewer is Unix-only: it needs a PTY, /dev/tty, and Unix signals.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The qualified compiler. Newer stable releases add lints and deprecations
      # (for example `fetch_update`) whose fixes would raise the minimum Rust version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Git for test repositories
        run: |
          git config --global user.name "diffs-rs CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy, all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --release --locked --no-fail-fast -- --test-threads=1
      - name: Embedded host checks
        run: |
          cargo build --release --locked --example embedded_viewer
          NATIVE_DIFF_HOST_BINARY="$PWD/target/release/examples/embedded_viewer" \
            cargo test --release --locked --test process engine_host_contract -- --ignored --test-threads=1

  msrv:
    name: minimum Rust (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
