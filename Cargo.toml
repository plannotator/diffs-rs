[package]
name = "native-diff"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast terminal diff viewer and embeddable Rust diff engine"
license = "Apache-2.0"
repository = "https://github.com/plannotator/diffs-rs"
readme = "README.md"
keywords = ["diff", "patch", "terminal", "tui", "ratatui"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# Publishing stays off until the crate no longer needs the [patch.crates-io]
# overrides below. crates.io ignores [patch], so a published build would
# silently use unpatched upstream syntect, fancy-regex and libgit2-sys.
publish = false
# Ship only what the library and binary need to build, plus the docs a reader
# of the crate needs. Tests, fixtures, tools, reports and vendor/ stay in Git.
include = [
    "/src/**/*.rs",
    "/assets/pierre/**",
    "/examples/embedded_viewer.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/EMBEDDING.md",
    "/LICENSE",
    "/NOTICE.md",
]

[features]
default = ["clipboard", "dev-tty"]
clipboard = ["dep:arboard"]
# Read keyboard input from /dev/tty, so the standalone viewer works when the
# patch arrives on stdin. Embedding hosts that own their own input can turn
# this off with `default-features = false`.
dev-tty = ["crossterm/use-dev-tty"]
delivery-trace = ["syntect/syntax-timing"]
regex-census = ["syntect/regex-census"]
owner-census = ["regex-census", "syntect/owner-census"]

[patch.crates-io]
syntect = { path = "vendor/syntect" }
fancy-regex = { path = "vendor/fancy-regex" }
libgit2-sys = { path = "vendor/libgit2-sys" }

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
hashbrown = { version = "0.16.1", default-features = false }
libc = "0.2"
memchr = "2.8"
nix = { version = "0.28", default-features = false, features = ["fs", "poll"] }
palette = "0.7"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
similar = "3.2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy", "shared-engines"] }
tempfile = "3"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.6.1", default-features = false, optional = true }

[dev-dependencies]
fancy-regex = "0.16.2"
portable-pty = "0.9"
vt100 = "0.16"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
